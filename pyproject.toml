[project]
name = "fast-staratlas-ai"
version = "0.1.0"
description = "FastAPI project skeleton based on the official fastapi-new scaffold."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "langchain-core>=1.6.2",
    "langchain-openai>=1.6.2",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.11.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.13",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["app", "tests"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
