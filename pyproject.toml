[project]
name = "fast-staratlas-ai"
version = "0.1.0"
description = "FastAPI project skeleton based on the official fastapi-new scaffold."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "langchain-core>=1.6.2",
    "langchain-openai>=1.6.2",
    "pydantic-settings>=2.11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
