services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: staratlas
      POSTGRES_PASSWORD: staratlas
      POSTGRES_DB: fast_staratlas_ai
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staratlas -d fast_staratlas_ai"]
      interval: 5s
      timeout: 5s
      retries: 5
